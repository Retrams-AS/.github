name: Chore / audit finding
description: Tech-debt, cleanup, hygiene, or an audit finding.
labels: ["chore"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Concrete file:line references, grep output, or commands.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: remediation
    attributes:
      label: Proposed remediation
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / open questions
    validations:
      required: false
