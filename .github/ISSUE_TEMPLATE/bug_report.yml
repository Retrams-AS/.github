name: Bug report
description: Report something broken.
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what's wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Actual behavior / impact
    validations:
      required: true
  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed fix (optional)
    validations:
      required: false
